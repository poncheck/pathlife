version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pathlife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathlife
      POSTGRES_PASSWORD: pathlife_password_change_me
      POSTGRES_DB: pathlife
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathlife -d pathlife"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pathlife-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: pathlife-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://pathlife:pathlife_password_change_me@postgres:5432/pathlife?schema=public

      # Server
      PORT: 3000
      NODE_ENV: production

      # Security (CHANGE THESE IN PRODUCTION!)
      JWT_SECRET: ${JWT_SECRET:-change-me-use-long-random-string-min-32-chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-use-32-character-string}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}

      # Immich Configuration (set your values)
      IMMICH_URL: ${IMMICH_URL}
      IMMICH_API_KEY: ${IMMICH_API_KEY}

      # Strava Configuration (set your values)
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN}

      # Traccar Configuration (set your values)
      TRACCAR_URL: ${TRACCAR_URL}
      TRACCAR_EMAIL: ${TRACCAR_EMAIL}
      TRACCAR_PASSWORD: ${TRACCAR_PASSWORD}

      # Sync Schedule (default: every 6 hours)
      SYNC_SCHEDULE: ${SYNC_SCHEDULE:-0 */6 * * *}
    volumes:
      # Persist GPX files
      - gpx_data:/app/apps/backend/data/gpx
    ports:
      - "3000:3000"
    networks:
      - pathlife-network

  # Frontend Web App
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: pathlife-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - pathlife-network

networks:
  pathlife-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  gpx_data:
    driver: local
